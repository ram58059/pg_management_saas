databases:
  - name: stayi-pg-management
    plan: free
    databaseName: stayi_pg_management
    user: stayi_pg_management_user

services:
  - type: cron
    name: generate-monthly-rent-dues
    schedule: '0 0 1 * *'
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python manage.py generate_monthly_rent_dues'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stayi-pg-management
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false

  - type: web
    plan: free
    name: pg_management_saas
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stayi-pg-management
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false