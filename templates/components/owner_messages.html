{% if messages %}
<div class="mb-6 space-y-3" aria-live="polite">
    {% for message in messages %}
    <div class="owner-alert {% if message.tags == 'error' %}owner-alert-error{% elif message.tags == 'success' %}owner-alert-success{% elif message.tags == 'warning' %}owner-alert-warning{% else %}owner-alert-info{% endif %}">
        <svg class="h-5 w-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            {% if message.tags == 'error' %}
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            {% elif message.tags == 'success' %}
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            {% else %}
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            {% endif %}
        </svg>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
