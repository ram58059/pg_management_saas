{% load static %}
<aside id="owner-sidebar" class="owner-sidebar flex flex-col" aria-label="Owner portal navigation">
    <div class="owner-sidebar-brand">
        <div class="owner-sidebar-logo">S</div>
        <div>
            <div class="owner-sidebar-title">Stayi</div>
            <div class="owner-sidebar-subtitle">Owner Portal</div>
        </div>
    </div>

    <nav class="owner-nav flex-1 overflow-y-auto">
        <a href="{% url 'owner_dashboard' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'owner_dashboard' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/></svg>
            Dashboard
        </a>
        <a href="{% url 'properties_list' %}" class="owner-nav-link {% if 'propert' in request.resolver_match.url_name %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            Properties
        </a>
        <a href="{% url 'rooms_list' %}" class="owner-nav-link {% if 'room' in request.resolver_match.url_name %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
            Rooms
        </a>
        <a href="{% url 'tenants_list' %}" class="owner-nav-link {% if 'tenant' in request.resolver_match.url_name %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Tenants
        </a>
        <a href="{% url 'electricity_bills_manager' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'electricity_bills_manager' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Electricity
        </a>
        <a href="{% url 'payment_verifications' %}" class="owner-nav-link {% if 'payment_verification' in request.resolver_match.url_name or request.resolver_match.url_name == 'verify_payment' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            Verifications
            {% if pending_verifications_count %}
            <span class="owner-nav-badge">{{ pending_verifications_count }}</span>
            {% endif %}
        </a>
        <a href="{% url 'payment_settings' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'payment_settings' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Payment Settings
        </a>
    </nav>

    <div class="owner-sidebar-footer">
        <div class="mb-3">
            <div class="text-sm font-semibold text-white">{{ user.get_full_name|default:user.username }}</div>
            <div class="text-xs text-slate-400">{{ user.get_role_display }}</div>
        </div>
        <a href="{% url 'logout' %}" class="owner-btn owner-btn-secondary w-full justify-center bg-white/10 text-white border-white/10 hover:bg-white/15">
            Sign out
        </a>
    </div>
</aside>

<div id="owner-sidebar-backdrop" class="owner-sidebar-backdrop hidden lg:hidden" aria-hidden="true"></div>
