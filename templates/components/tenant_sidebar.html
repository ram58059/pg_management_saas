{% load static %}
<aside id="tenant-sidebar" class="owner-sidebar flex flex-col" aria-label="Tenant portal navigation">
    <div class="owner-sidebar-brand">
        <div class="owner-sidebar-logo">S</div>
        <div>
            <div class="owner-sidebar-title">Stayi</div>
            <div class="owner-sidebar-subtitle">Tenant Portal</div>
        </div>
    </div>

    <nav class="owner-nav flex-1 overflow-y-auto">
        <a href="{% url 'tenant_dashboard' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'tenant_dashboard' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/></svg>
            Dashboard
        </a>
        <a href="{% url 'tenant_payment_intent' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'tenant_payment_intent' or request.resolver_match.url_name == 'tenant_pay_rent' or request.resolver_match.url_name == 'tenant_payment_page' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Pay Rent
        </a>
        <a href="{% url 'tenant_payments' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'tenant_payments' or request.resolver_match.url_name == 'download_invoice' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Invoices
        </a>
        <a href="{% url 'tenant_payment_history' %}" class="owner-nav-link {% if request.resolver_match.url_name == 'tenant_payment_history' %}is-active{% endif %}">
            <svg class="owner-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Payment History
        </a>
    </nav>

    <div class="owner-sidebar-footer">
        <div class="mb-3">
            <div class="text-sm font-semibold text-white">{{ user.get_full_name|default:user.username }}</div>
            <div class="text-xs text-slate-400">{{ user.get_role_display }}</div>
        </div>
        <a href="{% url 'logout' %}" class="owner-btn owner-btn-secondary w-full justify-center bg-white/10 text-white border-white/10 hover:bg-white/15">
            Sign out
        </a>
    </div>
</aside>

<div id="tenant-sidebar-backdrop" class="owner-sidebar-backdrop hidden lg:hidden" aria-hidden="true"></div>
