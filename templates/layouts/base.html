{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PG Management{% endblock %}</title>
    <link href="{% static 'css/output.css' %}?v=2" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    {% include 'components/navbar.html' %}
    
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% if messages %}
            <div class="mb-8 space-y-4">
                {% for message in messages %}
                    <div class="p-4 rounded-xl shadow-sm text-sm font-semibold 
                        {% if message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200
                        {% elif message.tags == 'success' %}bg-emerald-100 text-emerald-800 border border-emerald-200
                        {% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}
    
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
